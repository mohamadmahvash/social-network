{% extends 'base.html' %}
{% block content %}
    <h2 class="text-center"> {{ user.username }} </h2>
    <hr>
    <div class="card">
        {% for post in posts %}
            <a href="{% url 'home:detail' post.id post.slug %}" class="card-body"> {{ post.body|truncatewords:3 }} </a>
        {% endfor %}
    </div>
{% endblock %}
